# AI Bridge — verification workflow (ROADMAP Stage 2).
#
# Runs the same `npm run verify` chain a developer runs locally: strict typecheck, the coupling /
# secret-leak / runtime-dependency gates, the full test suite, the build, and the portability gate.
# A red build here means the contracts are not independently consumable, so it is a release gate
# rather than a convenience.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.20.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (locked, from the committed lockfile)
        run: npm ci

      - name: Verify
        run: npm run verify
